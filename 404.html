<!doctype html>
<html lang="de-CH">
<head>

  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f4f2eb">
  <title>Seite nicht gefunden — OrbMatter</title>
  <!-- Self-contained so the error page also works for missing nested paths. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f2eb; color: #2f352c; font: 17px/1.7 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    main { max-width: 1000px; margin: auto; padding: clamp(28px, 7vw, 90px); min-height: 100svh; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .brand { font-size: 31px; letter-spacing: -1.9px; line-height: 1; margin-bottom: 65px; color: inherit; text-decoration: none; }
    .brand span { color: #8c503c; }
    .eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }
    h1 { font: 400 clamp(44px, 8vw, 84px)/1.08 Georgia, 'Times New Roman', serif; letter-spacing: -.055em; margin: 22px 0 26px; }
    h1 em { color: #586345; font-weight: 400; }
    p { max-width: 490px; color: #666a5e; margin: 0; }
    .button { display: inline-flex; align-items: center; gap: 28px; background: #3d4b38; color: #f4f2eb; border-radius: 32px; padding: 14px 23px; margin-top: 30px; text-decoration: none; font-size: 16px; }
    .button:hover { background: #253221; }
    .contact { margin-top: 36px; font-size: 14px; }
    .contact a { color: inherit; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid #8c503c; outline-offset: 6px; }
    @media (max-width: 400px) { .brand { margin-bottom: 42px; } h1 { font-size: 43px; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="https://www.orbmatter.ch/" aria-label="OrbMatter — Startseite">OrbMatter<span>.</span></a>
    <p class="eyebrow">404 / Seite nicht gefunden</p>
    <h1>Ein kleiner Umweg.<br><em>Eine neue Richtung.</em></h1>
    <p>Diese Seite gibt es hier leider nicht. Auf unserer Startseite findest du Workshops, Designobjekte und neue Möglichkeiten.</p>
    <a class="button" href="https://www.orbmatter.ch/">Zur Startseite <span aria-hidden="true">↗</span></a>
    <p class="contact">Oder sag Hallo: <a href="mailto:sarah@orbmatter.ch">sarah@orbmatter.ch</a></p>
  </main>
