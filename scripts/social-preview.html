<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>OrbMatter — Vorlage für das Vorschaubild</title>
  <!-- Render at exactly 1200 × 630 px and save to assets/social-preview.png. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f4f2eb; color: #2f352c; font-family: Helvetica, Arial, sans-serif; }
    main { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; }
    .copy { padding: 46px 48px; display: flex; flex-direction: column; align-items: flex-start; }
    .brand { font-size: 36px; letter-spacing: -2px; }
    .brand span { color: #8c503c; }
    .eyebrow { text-transform: uppercase; font-size: 12px; letter-spacing: .13em; margin: 28px 0 0; }
    h1 { margin: 28px 0 24px; font: 400 77px/1.03 Georgia, 'Times New Roman', serif; letter-spacing: -.06em; }
    h1 em { color: #586345; font-weight: 400; }
    .description { margin: 0; color: #666a5e; font-size: 17px; line-height: 1.6; }
    .url { margin: auto 0 0; font-size: 15px; color: #586345; }
    img { display: block; width: 100%; height: 630px; object-fit: cover; }
  </style>
</head>
<body>
  <main>
    <div class="copy">
      <div class="brand">OrbMatter<span>.</span></div>
      <p class="eyebrow">Eine Designpraxis aus Bern</p>
      <h1>Material.<br>Mensch.<br><em>Möglichkeit.</em></h1>
      <p class="description">Regenerative Materialien.<br>Workshops. Objekte. Zusammenarbeit.</p>
      <p class="url">orbmatter.ch</p>
    </div>
    <img src="../assets/images/klang-kiosk-portrait.webp" alt="Kastagnetten für Klang Kiosk" width="1280" height="1707">
  </main>
</body>
</html>
